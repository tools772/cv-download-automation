<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfect Ventures Fetch Agent</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Perfect Ventures Fetch Agent</h1>
    <p class="subtitle">Instahyre &amp; Naukri CV download for Caliber</p>
  </header>

  <section class="card">
    <label for="email">Caliber portal email</label>
    <div class="row">
      <input id="email" type="email" placeholder="you@perfect.ventures" />
      <button id="save-email" type="button">Save</button>
    </div>
    <p id="config-hint" class="hint"></p>
  </section>

  <section class="card actions">
    <button id="start" class="primary">Start agent</button>
    <button id="stop" disabled>Stop</button>
    <button id="login-in">Login Instahyre</button>
    <button id="login-nk">Login Naukri</button>
    <button id="open-sessions" class="ghost">Open sessions folder</button>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>

  <footer>
    Keep this app running while using <strong>Fetch CVs &amp; Rank</strong> in Caliber.
    Connect Google Drive in the portal first.
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
